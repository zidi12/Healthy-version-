<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Healthy Version | Subscription Manager</title>
<style>
:root{--g:#176b45;--d:#124b32;--p:#e8f4ed;--bg:#f4f7f5;--ink:#17251d;--m:#68776e;--line:#dce6df;--red:#b83232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}header{background:var(--d);color:white;padding:16px 19px}header strong{font-size:20px}header small{display:block;opacity:.82}nav{display:flex;gap:8px;padding:12px max(12px,calc((100% - 1000px)/2));background:white;border-bottom:1px solid var(--line)}main{max-width:1000px;margin:auto;padding:17px}.panel,.customer{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}h2{font-size:20px;margin:0 0 13px}h3{margin:0 0 7px}.muted{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;color:var(--m);margin-bottom:5px}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid var(--line)}input{width:100%;min-width:0}button{background:var(--g);border:0;color:white;font-weight:650;cursor:pointer}button.secondary{background:var(--p);color:#145536;border:1px solid #d5e8dc}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.toolbar{display:flex;gap:9px;margin-bottom:13px}.toolbar input{flex:1}.customer{cursor:pointer}.customer-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.balance{font-size:25px;font-weight:800;color:#146b43}.finished{color:var(--red)}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--p);color:#145536;font-size:12px;font-weight:700}.bad{background:#fff0f0;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:13px 0}.stat{background:#f2f7f3;border-radius:10px;padding:11px}.stat span{font-size:12px;color:var(--m);display:block}.stat b{display:block;margin-top:3px}.tablewrap{overflow:auto;margin-top:9px}table{width:100%;border-collapse:collapse;min-width:570px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px;font-size:13px}.notice{padding:11px;border-radius:10px;background:#fff7df;color:#6a5315;font-size:12px;margin-bottom:14px}.detailtop{display:flex;gap:10px;align-items:center;margin-bottom:14px}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}}
</style></head><body>
<header><strong>HEALTHY VERSION</strong><small>Prepaid subscription manager</small></header>
<nav><button id="tabAdd" onclick="page('add')">＋ Add Customer</button><button id="tabList" class="secondary" onclick="page('list')">Customer Details</button></nav>
<main><div class="notice" id="syncNotice"><b>Cloud sync:</b> Connecting…</div>
<section id="addPage"><div class="panel"><h2 id="formTitle">Enter customer subscription</h2><div class="grid">
<div class="field"><label>Customer name *</label><input id="name" placeholder="Customer full name"></div><div class="field"><label>Mobile number *</label><input id="phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
<div class="field"><label>Branch name *</label><input id="branch" placeholder="Enter branch name"></div><div class="field"><label>Subscription type *</label><input id="type" placeholder="Enter subscription type"></div>
<div class="field"><label>Number of days *</label><input id="days" type="number" min="1" placeholder="e.g. 30"></div><div class="field"><label>Prepaid amount (SAR) *</label><input id="payment" type="number" min=".01" step=".01" placeholder="e.g. 1000"></div>
<div class="field"><label>Subscription date</label><input id="date" type="date"></div></div><div class="actions"><button id="saveBtn" onclick="saveCustomer()">Save Customer</button><button class="secondary" onclick="resetForm()">Clear Form</button></div></div></section>
<section id="listPage" class="hidden"><div class="panel"><h2>Customer Details</h2><div class="toolbar"><input id="search" placeholder="Search name, mobile, branch or subscription"><button onclick="renderList()">Search</button></div><div id="count" class="muted"></div></div><div id="list"></div></section>
<section id="profilePage" class="hidden"><div class="detailtop"><button class="secondary" onclick="page('list')">← Back</button><h2 style="margin:0">Customer Account Details</h2></div><div id="profile"></div></section></main>
<script>
<script>const $=id=>document.getElementById(id),API='https://fnwxahbfraewrkqelrlv.supabase.co/functions/v1/subscription-manager-api';let db={customers:[]},selected=null,password=sessionStorage.getItem('hv_shared_access')||'';
async function cloud(action,customer){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,action,customer})});const j=await r.json();if(!r.ok)throw Error(j.error||'Cloud error');return j}\nasync function connect(){while(true){if(!password)password=prompt('Enter shared subscription app password:')||'';if(!password)return;try{let j=await cloud('list');db.customers=j.customers||[];db.customers.forEach(c=>{c.transactions=Array.isArray(c.transactions)?c.transactions:[];c.branchName=c.branchName||c.branch||''});sessionStorage.setItem('hv_shared_access',password);$('syncNotice').innerHTML='<b>Connected to live cloud database.</b> Shared across browsers and branches.';renderList();return}catch(e){password='';sessionStorage.removeItem('hv_shared_access');alert(e.message);if(!confirm('Try again?'))return}}}
db.customers.forEach(c=>{c.transactions=Array.isArray(c.transactions)?c.transactions:[];c.branchName=c.branchName||c.branch||c.transactions.find(t=>t.branch)?.branch||''});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'SAR '+Number(n||0).toFixed(2),bal=c=>c.transactions.reduce((a,t)=>a+(t.kind==='Deduction'?-Number(t.amount):Number(t.amount)),0);
async function persist(){try{await Promise.all(db.customers.map(c=>cloud('save',c)));$('syncNotice').innerHTML='<b>Saved to cloud.</b> Shared data is up to date.'}catch(e){alert('Cloud save failed: '+e.message)}}
function page(p){['addPage','listPage','profilePage'].forEach(x=>$(x).classList.add('hidden'));$('tabAdd').classList.toggle('secondary',p!=='add');$('tabList').classList.toggle('secondary',p==='add');if(p==='add')$('addPage').classList.remove('hidden');if(p==='list'){$('listPage').classList.remove('hidden');renderList()}if(p==='profile'){$('profilePage').classList.remove('hidden');renderProfile()}}
function resetForm(){['name','phone','branch','type','days','payment'].forEach(x=>$(x).value='');$('date').value=new Date().toISOString().slice(0,10);$('formTitle').textContent='Enter customer subscription';$('saveBtn').textContent='Save Customer';delete $('saveBtn').dataset.edit}
function saveCustomer(){let name=$('name').value.trim(),phone=$('phone').value.trim(),branchName=$('branch').value.trim(),type=$('type').value.trim(),duration=Number($('days').value),payment=Number($('payment').value),startDate=$('date').value;if(!name||!phone||!branchName||!type||!Number.isInteger(duration)||duration<1)return alert('Please enter name, mobile, branch, subscription type and valid days.');let id=$('saveBtn').dataset.edit;
if(id){let c=db.customers.find(x=>x.id===id);if(!c)return;Object.assign(c,{name,phone,branchName,type,duration,startDate});if($('payment').value&&payment>0)c.transactions.push({kind:'Top-up',amount:payment,branch:branchName,date:new Date().toISOString(),note:'Additional prepaid payment'})}
else{if(!$('payment').value||!Number.isFinite(payment)||payment<=0)return alert('Enter prepaid amount greater than zero.');db.customers.push({id:'C'+Date.now(),name,phone,branchName,type,duration,startDate,transactions:[{kind:'Payment',amount:payment,branch:branchName,date:new Date().toISOString(),note:'Initial prepaid payment'}]})}
persist();resetForm();page('list')}
function renderList(){let q=$('search').value.trim().toLowerCase(),items=db.customers.filter(c=>[c.name,c.phone,c.branchName,c.type].join(' ').toLowerCase().includes(q));$('count').textContent=items.length+' customer(s) found';$('list').innerHTML=items.map(c=>{let b=bal(c),zero=b<=0;return `<article class="customer" onclick="openProfile('${esc(c.id)}')"><div class="customer-head"><div><h3>${esc(c.name)}</h3><div class="muted">${esc(c.phone)} · ${esc(c.branchName)} · ${esc(c.type)}</div><div class="muted">${esc(c.duration)} days · ${esc(c.startDate)}</div></div><div style="text-align:right"><span class="pill ${zero?'bad':''}">${zero?'BALANCE FINISHED':'ACTIVE'}</span><div class="balance ${zero?'finished':''}">${money(Math.max(0,b))}</div><small class="muted">Remaining balance</small></div></div><div class="muted" style="margin-top:8px">Tap to see full details and transactions →</div></article>`}).join('')||'<div class="panel muted">No customers found.</div>'}
function openProfile(id){selected=id;page('profile')}
function renderProfile(){let c=db.customers.find(x=>x.id===selected);if(!c){page('list');return}let b=bal(c),zero=b<=0,paid=c.transactions.filter(t=>t.kind!=='Deduction').reduce((s,t)=>s+Number(t.amount),0),spent=c.transactions.filter(t=>t.kind==='Deduction').reduce((s,t)=>s+Number(t.amount),0);
$('profile').innerHTML=`<div class="panel"><div class="customer-head"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.phone)}</div></div><div style="text-align:right"><span class="pill ${zero?'bad':''}">${zero?'BALANCE FINISHED':'ACTIVE BALANCE'}</span><div class="balance ${zero?'finished':''}">${money(Math.max(0,b))}</div><small class="muted">Remaining balance</small></div></div>
<div class="stats"><div class="stat"><span>Branch</span><b>${esc(c.branchName)}</b></div><div class="stat"><span>Subscription type</span><b>${esc(c.type)}</b></div><div class="stat"><span>Duration</span><b>${esc(c.duration)} days</b></div><div class="stat"><span>Total prepaid</span><b>${money(paid)}</b></div><div class="stat"><span>Total deducted</span><b>${money(spent)}</b></div><div class="stat"><span>Start date</span><b>${esc(c.startDate)}</b></div></div>
<div class="grid"><div class="field"><label>Meal deduction (SAR)</label><input id="deduct" type="number" min=".01" step=".01" placeholder="e.g. 40"></div><div class="field"><label>Meal / order note</label><input id="note" placeholder="Optional note"></div></div><div class="actions"><button onclick="deduct()">Deduct Amount</button><button class="secondary" onclick="topup()">Add Prepaid Money</button><button class="secondary" onclick="edit()">Edit Details</button></div>
<h3 style="margin-top:20px">Transaction History</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Transaction</th><th>Branch</th><th>Amount</th><th>Note</th></tr></thead><tbody>${c.transactions.slice().reverse().map(t=>`<tr><td>${new Date(t.date).toLocaleString()}</td><td>${esc(t.kind)}</td><td>${esc(t.branch||'—')}</td><td>${t.kind==='Deduction'?'-':'+'}${money(t.amount)}</td><td>${esc(t.note||'')}</td></tr>`).join('')||'<tr><td colspan="5">No transactions yet</td></tr>'}</tbody></table></div></div>`}
function deduct(){let c=db.customers.find(x=>x.id===selected),a=Number($('deduct').value);if(!a||a<=0)return alert('Enter a valid amount.');if(a>bal(c))return alert('Insufficient balance. Remaining: '+money(Math.max(0,bal(c))));c.transactions.push({kind:'Deduction',amount:a,branch:c.branchName,date:new Date().toISOString(),note:$('note').value.trim()||'Meal'});persist();renderProfile()}
function topup(){let c=db.customers.find(x=>x.id===selected),v=prompt('Additional prepaid amount (SAR):');if(v===null)return;let a=Number(v);if(!a||a<=0)return alert('Enter a valid amount.');c.transactions.push({kind:'Top-up',amount:a,branch:c.branchName,date:new Date().toISOString(),note:'Additional prepaid payment'});persist();renderProfile()}
function edit(){let c=db.customers.find(x=>x.id===selected);$('name').value=c.name;$('phone').value=c.phone;$('branch').value=c.branchName;$('type').value=c.type;$('days').value=c.duration;$('payment').value='';$('date').value=c.startDate||'';$('formTitle').textContent='Edit customer details';$('saveBtn').textContent='Update Customer';$('saveBtn').dataset.edit=c.id;page('add')}
$('date').value=new Date().toISOString().slice(0,10);connect();setInterval(async()=>{if(!password)return;try{let j=await cloud('list');db.customers=j.customers||[];db.customers.forEach(c=>{c.transactions=Array.isArray(c.transactions)?c.transactions:[];c.branchName=c.branchName||c.branch||''});if(!$('listPage').classList.contains('hidden'))renderList();if(!$('profilePage').classList.contains('hidden'))renderProfile()}catch(e){$('syncNotice').textContent='Cloud sync error: '+e.message}},5000);
</script></body></html>
